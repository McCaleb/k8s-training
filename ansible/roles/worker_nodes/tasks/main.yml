---
# worker_nodes: join worker nodes to the cluster

- name: Join worker node to the cluster
  block:
    - name: Check whether this node has already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: __worker_nodes_kubelet_conf

    - name: Generate a join command
      ansible.builtin.command:
        cmd: "kubeadm token create --ttl {{ worker_nodes_join_token_ttl | default('5m') }} --print-join-command"
      register: __worker_nodes_join_command
      changed_when: true
      delegate_to: "{{ primary_control_node }}"
      run_once: true
      no_log: true

    - name: Join node to the control plane
      ansible.builtin.command:
        cmd: "{{ __worker_nodes_join_command['stdout'] | trim }}"
      when: not __worker_nodes_kubelet_conf['stat']['exists']
      changed_when: true
      no_log: true

- name: Verify node is ready
  ansible.builtin.command:
    cmd: >-
      kubectl wait --for=condition=Ready
      node/{{ ansible_facts['hostname'] }}
      --timeout={{ worker_nodes_ready_timeout }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ primary_control_node }}"
  changed_when: false

- name: Collect cluster node status
  ansible.builtin.command:
    cmd: "kubectl get nodes"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ primary_control_node }}"
  run_once: true
  changed_when: false

...
