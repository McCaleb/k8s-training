---
- name: Create .kube directory in home dir
  ansible.builtin.file:
    force: true
    group: root
    mode: '0600'
    owner: root
    state: directory
    path: "/root/.kube"

- name: Copy admin.conf to home dir
  ansible.builtin.copy:
    backup: false
    force: true
    group: root
    mode: '0644'
    owner: root
    remote_src: true    # true=file is on the target node
    src: /etc/kubernetes/admin.conf
    dest: "/root/.kube/config"
...