---
- name: Install packages
  ansible.builtin.apt:
    name: "{{ control_nodes_packages }}"
    state: present
    update_cache: true

- name: Kernel modules
  block:
    - name: Persist kernel modules for the runtime and kube-proxy
      ansible.builtin.copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"

    - name: Reload systemd-modules-load
      ansible.builtin.systemd_service:
        name: systemd-modules-load
        state: restarted

- name: Disable swap
  block:
    - name: Disable swap for the current boot
      ansible.builtin.command: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0
      changed_when: true

    - name: Comment out swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

- name: Configure sysctl
  block:
    - name: Persist sysctl params for the runtime and kube-proxy
      ansible.builtin.copy:
        dest: /etc/sysctl.d/kubernetes.conf
        force: true
        mode: '0644'
        owner: root
        group: root
        remote_src: false    # false=file is on Ansible controller node
        src: sysctl.99-kubernetes.conf

    - name: Reload sysctl
      ansible.builtin.command:
        cmd: "sysctl --system"
      register: __control_nodes_sysctl_reload
      changed_when: __control_nodes_sysctl_reload['rc'] != 0
