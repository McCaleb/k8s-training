---
# Build the cluster: patch, baseline, then per-node-type roles

- name: Configure kubernetes nodes
  hosts: all
  # control_nodes
  become: true
  any_errors_fatal: true
  tasks:

    - name: Update Debian systems
      ansible.builtin.import_role:
        name: debian_update
      vars:
        debian_update_reboot: true
        debian_update_restart_services: true

    - name: Run common role
      ansible.builtin.import_role:
        name: common

    - name: Run load balancer role
      ansible.builtin.include_role:
        name: load_balancers
      when: "'load_balancers' in group_names"

    - name: Run control plane role
      ansible.builtin.include_role:
        name: control_nodes
      when: "'control_nodes' in group_names"

    - name: Run worker node role
      ansible.builtin.include_role:
        name: worker_nodes
      when: "'worker_nodes' in group_names"
...
